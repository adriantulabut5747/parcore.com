<!doctype html>
<!-- Thumbnail: Articles > Equipment Tier List (articles card, 16:9).
     Render: python _tools/thumbs/render.py equipment-tier-list  ->  site/clashofclans/articles/equipment-tier-list/thumb.webp
     Layers, back to front: squidball.jpg (heroes in a lightning fight) crushed nearly black,
     then the tier grid cropped out of the article's own banner. The grid uses
     mix-blend-mode: lighten, so its flat grey gaps let the bright lightning through
     while the icons stay on top. Paths are relative to this file. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #08090c; }
  .stage { position: relative; width: 1280px; height: 720px; overflow: hidden; isolation: isolate; }
  .art { position: absolute; inset: -20px; background: url("../../site/clashofclans/coctools/squidball.jpg") center 40% / cover;
    filter: blur(2px) saturate(1.1) brightness(0.2); }
  .vignette { position: absolute; inset: 0;
    background: radial-gradient(75% 80% at 50% 50%, rgba(8, 9, 12, 0) 30%, rgba(8, 9, 12, 0.92) 100%); }
  /* banner.webp crop: the grid sits at x 250-1670, y 104-718 of 1920x823 */
  .grid { position: absolute; left: 50%; top: 59%; width: 940px; height: 407px; transform: translate(-50%, -50%);
    background: url("../../site/clashofclans/articles/equipment-tier-list/banner.webp") -166px -69px / 1271px 545px;
    mix-blend-mode: lighten; }
</style>
</head>
<body>
<div class="stage">
  <div class="art"></div>
  <div class="vignette"></div>
  <div class="grid"></div>
</div>
</body>
</html>
