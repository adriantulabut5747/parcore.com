<!doctype html>
<!-- Banner + thumbnail: Articles > Minecraft > 3x3 Piston Door.
     Render: python _tools/thumbs/render.py 3x3-piston-door
       -> site/minecrafticons/articles/3x3-piston-door/banner.webp (1920) + thumb.webp (800)
     The art is the article's own 3D model (assets/mc/door-render.png: a transparent render of
     mc-build.js, re-shoot it if the build changes). Headline: the hook, the door fits in one wall. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #111113; }
  .stage { position: relative; width: 1280px; height: 720px; overflow: hidden; isolation: isolate;
    background: linear-gradient(180deg, #151518 0%, #0e0e10 100%); }
  .slab { position: absolute; top: -200px; height: 1200px; transform: skewX(-24deg); }
  .s1 { left: 560px; width: 260px; background: rgba(255, 255, 255, 0.022); }
  .s2 { left: 900px; width: 120px; background: rgba(255, 255, 255, 0.016); }
  .s3 { left: 1180px; width: 300px; background: rgba(194, 59, 59, 0.05); }
  .glow { position: absolute; left: 640px; top: 40px; width: 600px; height: 600px;
    background: radial-gradient(closest-side, rgba(255, 255, 255, 0.14), rgba(194, 59, 59, 0.2) 45%, rgba(194, 59, 59, 0) 100%); }
  /* art kept inside the margins: right ~ 70px, top clear of the card's category chip, bottom 150px@1080 clean */
  .door { position: absolute; right: 90px; top: 92px; height: 500px; width: auto;
    filter: drop-shadow(0 24px 30px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 40px rgba(255, 255, 255, 0.08)); }
  .copy { position: absolute; left: 64px; top: 50%; transform: translateY(-58%); font-family: 'Orbitron', sans-serif; font-weight: 900; text-transform: uppercase; }
  .l1, .l2 { font-size: 78px; line-height: 0.98; letter-spacing: 0.01em; }
  .l1 { color: #a9abb1; } .l2 { color: #fff; }
  .l3 { font-size: 118px; line-height: 0.98; color: #c23b3b; letter-spacing: 0.005em; margin-top: 4px; }
  .sub { margin-top: 22px; font-weight: 700; font-size: 30.7px; letter-spacing: 0.02em; color: #e6e7ea; }
</style>
</head>
<body>
<div class="stage">
  <div class="slab s1"></div><div class="slab s2"></div><div class="slab s3"></div>
  <div class="glow"></div>
  <img class="door" src="assets/mc/door-render.png" alt="">
  <div class="copy">
    <div class="l1">3x3 door</div>
    <div class="l2">One wall</div>
    <div class="l3">Thick.</div>
    <div class="sub">11 sticky pistons · 10 observers</div>
  </div>
</div>
</body>
</html>
