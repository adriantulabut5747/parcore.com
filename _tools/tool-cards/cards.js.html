<script>
// Tool-card art (.ptc-art), shared by every animated card:
// - animations run only while the card is on screen (.is-on);
// - fine pointers: the scene leans toward the pointer (--mx / --my);
// - data-go="<class>": hover / keyboard focus adds that class (the busy
//   loop). Leaving doesn't drop it mid-move: it waits for the end of the
//   current loop, i.e. the next animationiteration of data-clock.
//   Touch screens can't hover: they get one loop when the card scrolls in.
(function () {
  var fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  // /coc/ phones show still frames too (the CSS turns their animations off)
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches ||
    (document.body.classList.contains('coc-home') && matchMedia('(max-width: 760px)').matches);
  document.querySelectorAll('.ptc-art').forEach(function (art) {
    var card = art.closest('.ptc');
    var go = art.dataset.go, clock = art.dataset.clock, leaving = false;
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) {
        es.forEach(function (e) { art.classList.toggle('is-on', e.isIntersecting); });
      }).observe(card);
    } else art.classList.add('is-on');
    if (still) return;
    if (fine) {
      card.addEventListener('pointermove', function (e) {
        var r = card.getBoundingClientRect();
        art.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 2 - 1).toFixed(3));
        art.style.setProperty('--my', ((e.clientY - r.top) / r.height * 2 - 1).toFixed(3));
      });
      card.addEventListener('pointerleave', function () {
        art.style.setProperty('--mx', 0);
        art.style.setProperty('--my', 0);
      });
    }
    if (!go) return;
    function start() { leaving = false; art.classList.add(go); }
    function stop() { leaving = true; }
    card.addEventListener('animationiteration', function (e) {
      if (leaving && e.animationName === clock) { art.classList.remove(go); leaving = false; }
    });
    card.addEventListener('focus', start);
    card.addEventListener('blur', stop);
    if (fine) {
      card.addEventListener('pointerenter', start);
      card.addEventListener('pointerleave', stop);
    } else if ('IntersectionObserver' in window) {
      var once = new IntersectionObserver(function (es) {
        if (!es[0].isIntersecting) return;
        once.disconnect();
        start();
        stop();
      }, { threshold: 0.6 });
      once.observe(card);
    }
  });
})();
</script>
