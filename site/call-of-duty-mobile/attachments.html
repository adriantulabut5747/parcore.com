<style>
.codm-hero{
  position:relative;
  min-width:100%;
  min-height:455px;
  max-height:420px;
  overflow:hidden;
  flex:0 0 auto;
  background:#0c0c0d;
  margin-top: 45px;
}
.codm-hero-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background-image:url('/callofdutymobile-icons/02.jpg');
  background-repeat:no-repeat;
  background-size:cover;
  background-position:center 15%;
  filter:saturate(1.1) contrast(1.05);
  z-index:1;
}
/* On mobile this gets overridden with an explicit oversized background-size below,
   which guarantees both left-right AND up-down panning always work — with plain
   "cover", the crop math only leaves room to pan in ONE direction depending on
   how the image's shape compares to the box's shape (that's why the vertical
   number seemed to do nothing before: there was zero vertical room to pan through). */
/* fallback look when no image is supplied yet */
.codm-hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 80% 20%, rgba(194,45,45,0.16), transparent 55%),
    linear-gradient(135deg, #150404 0%, #0c0c0d 55%, #050505 100%);
  z-index:0;
}
.codm-hero-overlay{
  position:absolute;
  inset:0;
  z-index:2;
  display:flex;
  align-items:center;
  padding-left:6%;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.25) 100%),
    linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 45%);
}
/* Fade the very bottom of the hero into the same dark tone the battle pass
   widget uses, so the two sections blend into one continuous surface
   instead of meeting at a hard edge. */
.codm-hero::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:0;
  height:180px;
  z-index:3;
  pointer-events:none;
  background:linear-gradient(to bottom, rgba(18,18,19,0) 0%, rgba(18,18,19,0.75) 60%, #121213 100%);
}

.codm-hero-content{
  position:relative;
  z-index:3;
  max-width:640px;
  color:#fff;
  animation:codmFadeInUp .8s ease forwards;
  margin-top: 50px;
}
.codm-hero-eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  font-weight:800;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#ff5555;
  margin-bottom:14px;
}
.codm-hero-eyebrow::before{
  content:"";
  width:22px;
  height:2px;
  background:#c22d2d;
  display:inline-block;
}
.codm-hero-title{
  font-size:clamp(40px,6vw,72px);
  font-weight:900;
  line-height:1.02;
  text-transform:uppercase;
  margin-bottom:18px;
  background:linear-gradient(90deg,#ffffff,#e6dede,#c9c4c4);
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
  text-shadow:2px 4px 10px rgba(0,0,0,0.5);
  margin-left: 25%;
}
.codm-hero-title em{
  font-style:normal;
  background:linear-gradient(90deg,#be1b1b,#a70e0e);
  background-clip:text;
  -webkit-background-clip:text;
}
.codm-hero-tagline{

  color:#c8c8c8;
  max-width:520px;
  text-shadow:0 1px 3px rgba(0,0,0,0.6);
}

@keyframes codmFadeInUp{
  0%{opacity:0; transform:translateY(18px);}
  100%{opacity:1; transform:translateY(0);}
}

];

function codmRender(list){
  const grid = document.getElementById('codmGrid');
  grid.innerHTML = '';
  list.forEach(gun => {
    const card = document.createElement('div');
    card.className = 'gun-card';
    card.dataset.type = gun.type;
    card.dataset.name = gun.name.toLowerCase();
    card.innerHTML = `
      <div class="gun-card-imgwrap">
        ${gun.img ? `<img src="${gun.img}" alt="${gun.name}" class="zoomable" onclick="event.stopPropagation();openPalette(this)" onerror="this.style.display='none';this.nextElementSibling.classList.add('show');">` : ''}
        <div class="gun-card-placeholder${gun.img ? '' : ' show'}">
          <svg width="56" height="56" viewBox="0 0 236 256" fill="currentColor"><path fill-rule="evenodd" d="M45,0 L31,28 L71,100 L0,223 L174,222 Z M86,126 L127,197 L46,196 Z"/><path d="M108,35 L94,62 L207,256 L236,256 Z"/></svg>
        </div>
        ${gun.favorite ? '<span class="gun-fav-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.86L12 17.77l-6.18 3.23L7 14.14 2 9.27l7.1-1.01z"/></svg></span>' : ''}
      </div>
      <div class="gun-card-badges">
        <span class="gun-type-badge">${CODM_TYPE_LABELS[gun.type] || gun.type}</span>
        ${gun.modes && gun.modes.includes('multiplayer') ? '<span class="gun-mode-badge mode-mp">MP</span>' : ''}
        ${gun.modes && gun.modes.includes('battleroyale') ? '<span class="gun-mode-badge mode-br">BR</span>' : ''}
        <div class="gun-code-row" onclick="codmCopyCode(this, '${gun.code}')">
          <svg class="gun-code-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span class="gun-code-text">Copy</span>
          <span class="gun-code-copied-label">Copied!</span>
        </div>
      </div>
      <div class="gun-card-body">
        <div class="gun-card-name">${gun.name}</div>
        <div class="gun-card-desc">${gun.desc}</div>
      </div>`;
    grid.appendChild(card);
  });
}

// Order guns should appear in when sorting "By Type" - matches the pill row order
const CODM_TYPE_LABELS = { ar: 'Assault', sr: 'Sniper', smg: 'SMG', lmg: 'LMG', sg: 'Shotgun', marksman: 'Marksman', pistol: 'Pistol' };
const CODM_TYPE_ORDER = ['ar', 'sr', 'smg', 'lmg', 'sg', 'marksman', 'pistol'];
const CODM_SORT_LABELS = { popular: 'Popular', alpha: 'A-Z', type: 'Type' };
let codmSortMode = 'popular';

function codmToggleSort(e){
  e.stopPropagation();
  document.getElementById('codmSortWrap').classList.toggle('open');
}

function codmSelectSort(value, btn){
  codmSortMode = value;
  document.getElementById('codmSortLabel').textContent = CODM_SORT_LABELS[value];
  document.querySelectorAll('.codm-sort-option').forEach(o => o.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('codmSortWrap').classList.remove('open');
  codmFilter();
}

document.addEventListener('click', (e) => {
  const wrap = document.getElementById('codmSortWrap');
  if (wrap && wrap.classList.contains('open') && !wrap.contains(e.target)) {
    wrap.classList.remove('open');
  }
});

function codmFilter(){
  const activePill = document.querySelector('#codmPills .codm-pill.active');
  const type = activePill ? activePill.dataset.type : 'all';
  const activeModePill = document.querySelector('#codmModePills .codm-pill.active');
  const mode = activeModePill ? activeModePill.dataset.mode : 'multiplayer';
  const q = document.getElementById('codmSearch').value.toLowerCase().trim();
  const sortMode = codmSortMode;
  document.getElementById('codmSearchClear').style.display = q ? 'flex' : 'none';

  // keep each gun's original array position so "Most Popular" can restore it after sorting
  let filtered = CODM_GUNS
    .map((gun, i) => ({ gun, i }))
    .filter(({ gun }) => {
      const matchesMode = gun.modes && gun.modes.includes(mode);
      const matchesType = (type === 'all') || (type === 'favorites' ? gun.favorite === true : gun.type === type);
      const matchesQuery = gun.name.toLowerCase().includes(q);
      return matchesMode && matchesType && matchesQuery;
    });

  if (sortMode === 'alpha') {
    filtered.sort((a, b) => a.gun.name.localeCompare(b.gun.name, undefined, { numeric: true, sensitivity: 'base' }));
  } else if (sortMode === 'type') {
    filtered.sort((a, b) => {
      const typeDiff = CODM_TYPE_ORDER.indexOf(a.gun.type) - CODM_TYPE_ORDER.indexOf(b.gun.type);
      return typeDiff !== 0 ? typeDiff : a.i - b.i;
    });
  } else {
    // "popular" = however guns are ordered in CODM_GUNS (the default authoring order)
    filtered.sort((a, b) => a.i - b.i);
  }

  const result = filtered.map(({ gun }) => gun);
  codmFullResult = result;
  codmVisibleCount = CODM_PAGE_SIZE;
  codmRenderPage();
  document.getElementById('codmNoResults').style.display = result.length === 0 ? 'block' : 'none';
}

const CODM_PAGE_SIZE = 12;
let codmFullResult = [];
let codmVisibleCount = CODM_PAGE_SIZE;

function codmRenderPage(){
  const visible = codmFullResult.slice(0, codmVisibleCount);
  codmRender(visible);
  const btn = document.getElementById('codmViewMoreBtn');
  btn.classList.toggle('hidden', codmVisibleCount >= codmFullResult.length);
}

function codmShowMore(){
  codmVisibleCount += CODM_PAGE_SIZE;
  codmRenderPage();
}

document.querySelectorAll('#codmPills .codm-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('#codmPills .codm-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    codmFilter();
  });
});

document.querySelectorAll('#codmModePills .codm-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('#codmModePills .codm-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    codmFilter();
  });
});

function codmCopyCode(el, code){
  event.stopPropagation();
  const finish = () => {
    el.classList.add('copied');
    clearTimeout(el._codmCopyTimer);
    el._codmCopyTimer = setTimeout(() => el.classList.remove('copied'), 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(finish).catch(finish);
  } else {
    const ta = document.createElement('textarea');
    ta.value = code;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    finish();
  }
}

function codmClearSearch(){
  document.getElementById('codmSearch').value = '';
  codmFilter();
  document.getElementById('codmSearch').focus();
}

codmFilter();
</script>

<div id="pal-lightbox">
  <div id="pal-lb-inner" onclick="event.stopPropagation()">
    <img id="pal-lb-img" src="" alt="">
  </div>
</div>

<style>
/* ── LIGHTBOX BACKDROP ── */
#pal-lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(6px);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
#pal-lightbox.open { display: flex; }

/* ── CLOSE BUTTON ── */
#pal-lb-close {
  display: none;
  position: fixed;
  top: 16px; right: 16px;
  z-index: 99999;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: #222;
  border: 1px solid #444;
  color: #aaa;
  font-size: 16px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, background 0.15s;
}
#pal-lb-close:hover { color: #fff; background: #333; }

/* ── INNER WRAPPER ── */
#pal-lb-inner {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  cursor: default;
}

/* ── THE IMAGE ── */
#pal-lb-img {
  max-width: calc(100vw - 40px);
  max-height: calc(100vh - 80px);
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
  display: block;
  touch-action: none;
  user-select: none;
  transform-origin: center center;
  animation: lbZoomIn 0.2s ease;
}

@keyframes lbZoomIn {
  from { transform: scale(0.92); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}

.zoomable { cursor: pointer; }
</style>
<script>
// ── STATE ──
let palScale = 1;
let palPanX = 0, palPanY = 0;
let palIsPanning = false;
let palPanStartX = 0, palPanStartY = 0;
let palStartDist = 0, palLastScale = 1;

// ── HELPERS ──
function applyPalTransform() {
  document.getElementById('pal-lb-img').style.transform =
    `translate(${palPanX}px, ${palPanY}px) scale(${palScale})`;
}

function clampPalPan() {
  if (palScale <= 1) { palPanX = 0; palPanY = 0; return; }
  const img = document.getElementById('pal-lb-img');
  const maxX = Math.max(0, (img.offsetWidth  * palScale - window.innerWidth)  / 2);
  const maxY = Math.max(0, (img.offsetHeight * palScale - window.innerHeight) / 2);
  palPanX = Math.min(maxX, Math.max(-maxX, palPanX));
  palPanY = Math.min(maxY, Math.max(-maxY, palPanY));
}

function palEscHandler(e) { if (e.key === 'Escape') closePalette(); }

// ── OPEN ──
function openPalette(el) {
  const src = el.dataset.full || el.querySelector('img')?.src || el.src;
  const lb  = document.getElementById('pal-lightbox');
  const img = document.getElementById('pal-lb-img');

  // Reset state
  palScale = 1; palPanX = 0; palPanY = 0; palIsPanning = false;
  img.src = src;
  img.style.transform = 'translate(0px,0px) scale(1)';
  img.style.cursor = 'default';

  lb.classList.add('open');
  history.pushState({ modal: true }, '');
  document.getElementById('pal-lb-close').style.display = 'flex';
  document.addEventListener('keydown', palEscHandler);

  // ── MOUSE WHEEL ZOOM ──
  lb.onwheel = (e) => {
    e.preventDefault();
    const rect = img.getBoundingClientRect();
    const cx = e.clientX - (rect.left + rect.width  / 2);
    const cy = e.clientY - (rect.top  + rect.height / 2);
    const prev = palScale;
    palScale = Math.min(Math.max(1, palScale * (1 - e.deltaY * 0.002)), 6);
    const ratio = palScale / prev;
    palPanX = palPanX * ratio + cx * (ratio - 1);
    palPanY = palPanY * ratio + cy * (ratio - 1);
    clampPalPan();
    applyPalTransform();
    img.style.cursor = palScale > 1 ? 'grab' : 'default';
  };

  // ── MOUSE DRAG ──
  img.onmousedown = (e) => {
    if (palScale <= 1) return;
    e.preventDefault();
    palIsPanning = true;
    palPanStartX = e.clientX - palPanX;
    palPanStartY = e.clientY - palPanY;
    img.style.cursor = 'grabbing';
  };
  window.onmousemove = (e) => {
    if (!palIsPanning) return;
    palPanX = e.clientX - palPanStartX;
    palPanY = e.clientY - palPanStartY;
    clampPalPan();
    applyPalTransform();
  };
  window.onmouseup = () => {
    if (!palIsPanning) return;
    palIsPanning = false;
    img.style.cursor = palScale > 1 ? 'grab' : 'default';
  };

  // ── TOUCH PINCH + PAN ──
  img.ontouchstart = (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      palStartDist = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
      palLastScale = palScale;
    } else if (e.touches.length === 1 && palScale > 1) {
      palIsPanning = true;
      palPanStartX = e.touches[0].clientX - palPanX;
      palPanStartY = e.touches[0].clientY - palPanY;
    }
  };
  img.ontouchmove = (e) => {
    e.preventDefault();
    if (e.touches.length === 2) {
      const newDist = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
      const prev = palScale;
      palScale = Math.min(Math.max(1, palLastScale * (newDist / palStartDist)), 6);
      const ratio = palScale / prev;
      const rect  = img.getBoundingClientRect();
      const cx = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - (rect.left + rect.width  / 2);
      const cy = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - (rect.top  + rect.height / 2);
      palPanX = palPanX * ratio + cx * (ratio - 1);
      palPanY = palPanY * ratio + cy * (ratio - 1);
      clampPalPan();
      applyPalTransform();
    } else if (e.touches.length === 1 && palIsPanning) {
      palPanX = e.touches[0].clientX - palPanStartX;
      palPanY = e.touches[0].clientY - palPanStartY;
      clampPalPan();
      applyPalTransform();
    }
  };
  img.ontouchend = (e) => {
    if (e.touches.length < 2) palIsPanning = false;
    if (palScale <= 1) { palScale = 1; palPanX = 0; palPanY = 0; }
    else clampPalPan();
    applyPalTransform();
  };

  // Backdrop click closes, image click doesn't bubble up
  img.onclick   = (e) => e.stopPropagation();
  lb.onclick    = (e) => { if (e.target === lb) closePalette(); };
}

// ── CLOSE ──
function closePalette() {
  const lb = document.getElementById('pal-lightbox');
  if (!lb.classList.contains('open')) return;
  lb.classList.remove('open');
  document.getElementById('pal-lb-close').style.display = 'none';
  palScale = 1; palPanX = 0; palPanY = 0; palIsPanning = false;
  window.onmousemove = null;
  window.onmouseup   = null;
  document.removeEventListener('keydown', palEscHandler);
  if (history.state?.modal) history.back();
}

window.addEventListener('popstate', () => {
  const lb = document.getElementById('pal-lightbox');
  if (lb.classList.contains('open')) {
    lb.classList.remove('open');
    document.getElementById('pal-lb-close').style.display = 'none';
    palScale = 1; palPanX = 0; palPanY = 0; palIsPanning = false;
    window.onmousemove = null;
    window.onmouseup = null;
    document.removeEventListener('keydown', palEscHandler);
  }
});
</script>

/* ============================================================
   NOTHING BEHIND THE BARS BUT THE PAGE ITSELF
   ============================================================
   .main used to carry margin-top:52px to clear the fixed top bar, so
   .coc-main -- the scroller, and the thing that paints the page -- began at
   y=52. The mobile secondary bar is only 38px tall, so the moment it lifted
   into the top bar's slot on scroll, y=38..52 was a strip of bare <body>
   between the bar and the content. The scroller now starts at the top of the
   viewport and gives that 52px back as padding, so content sits exactly
   where it did before and there is no seam whatever the bars do.

   The sidebar took its offset from .main's margin, so it carries it itself
   at desktop widths; on mobile it is a fixed drawer with its own top:52px
   and never depended on it. */
.main{ margin-top: 0; }
.coc-main{ padding-top: var(--topbar-height, 52px); }
@media (min-width: 971px){
  .sidebar{ margin-top: var(--topbar-height, 40px); }
