<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Equipment Tier List Maker | Parchrome</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://parchrome.netlify.app/coc/tools/tier-list?type=equipment" />
    <!-- Merged into /coc/tools/tier-list (Oct 21 2026). Not a _redirects rule:
         a rule whose target has its own ?type= may drop a shared board's
         ?r=...&hero=..., and this keeps every parameter. -->

      location.replace('/coc/tools/tier-list?type=equipment' + location.search.replace(/^\?/, '&') + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=/coc/tools/tier-list?type=equipment" />
  </head>
  <body>
    <p><a href="/coc/tools/tier-list?type=equipment">Open the equipment tier list</a></p>
  </body>
