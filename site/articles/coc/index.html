<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clash of Clans Guides and Articles | Parchrome</title>
<meta name="description" content="Clash of Clans guides, tier lists and event explainers, written by a former #1 player in the Philippines.">
<link rel="canonical" href="https://parchrome.netlify.app/articles/coc/">
<meta name="theme-color" content="#0f0f10">
<link rel="icon" href="/icons/home.jpg">
<link rel="apple-touch-icon" href="/icons/home.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Sora:wght@400;500;600;650;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/11layout.css?v=20261008c">
<link rel="stylesheet" href="/article-cards.css">
<link rel="stylesheet" href="/articles.css">
</head>
<!-- Articles section. Shell copied from the game sections (tekken/index.html);
     nav comes from game-nav.json "articles-<game>", cards/feed from articles.json. -->
<body data-game-nav="articles-coc">

  <div id="page-loader">
  <div class="parchrome-fade">
    <div class="parchrome-ring"></div>
  </div>
  <span class="parchrome-label">Parchrome</span>
</div>

<!-- Top Nav -->
<div class="top-bar">
  <div class="top-bar-left-avatar"></div>
  <div class="hamburger" id="hamburger" onclick="toggleSidebar()">
    <span></span><span></span><span></span>
  </div>
  <div class="top-bar-title">
    <div class="topbar-logo"><img src="/icons/home.jpg" alt="" decoding="async"></div>
    Parchrome
  </div>
  <button id="search-btn" onclick="toggleSearch()" style="background:transparent; border:none; padding:0; cursor:pointer; right:15px; position:fixed; margin-top:2px;">
    <span id="search-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24">
        <circle cx="10" cy="10" r="6" stroke="#ffffff" stroke-width="3" fill="none"/>
        <line x1="15" y1="15" x2="21" y2="21" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </span>
    <span id="close-icon">✖</span>
  </button>
  <div id="search-overlay">
    <div id="search-input-wrap">
      <input type="search" id="search-input" placeholder="Find your next game" oninput="searchItems()" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
      <button type="button" id="search-input-clear" aria-label="Clear search" style="display:none;">✖</button>
    </div>
    <div id="search-results"></div>
    <div id="search-view-more" class="search-viewmore-sentinel" style="display:none;">Loading more…</div>
  </div>
</div>

<!-- Secondary Top Bar. The page strip is switched off (data-hub-nav="off",
     Adrian's pick): the bar holds the title / breadcrumb and the search only.
     The phone bottom nav still comes from game-nav.json "articles". -->
<div class="secondary-top-bar" id="secondary-top-bar">
  <div class="secondary-left has-crumbs">
    <img src="/icons/articles.svg" alt="" class="th-icon" decoding="async">
    <div class="secondary-content"><a href="/articles/">Articles</a><span class="sc-sep" aria-hidden="true">›</span><span aria-current="page">CoC</span></div>
    <nav class="stb-crumbs" aria-label="Breadcrumb"><a href="/articles/">Articles</a><span class="stb-crumb-sep" aria-hidden="true">›</span><span class="stb-crumb-name" aria-current="page">Clash of Clans</span></nav>
  </div>
  <div class="stb-divider" aria-hidden="true"></div>
  <nav class="stb-hub-nav" id="stbHubNav" data-hub-nav="off" aria-label="Article pages">
    <button type="button" class="dsn-scroll-btn dsn-scroll-left is-hidden" id="hubScrollLeft" aria-label="Scroll left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <div class="dsn-categories-scroll no-arrow-left no-arrow-right" id="stbHubNavScroll"></div>
    <button type="button" class="dsn-scroll-btn dsn-scroll-right is-hidden" id="hubScrollRight" aria-label="Scroll right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
  </nav>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="top-box" id="top-box"></div>
    <div class="games-container" id="games-container"></div>
    <div class="triple-a-container">
      <div class="triple-a-header" onclick="toggleTripleA()">
        <img src="/icons/controllericon.png" class="tripleimg" decoding="async" alt="">
        Triple A Games <span class="arrow">></span>
      </div>
      <div class="triple-a-list" id="triple-a-list"></div>
    </div>
  </div>

  <div class="coc-main">

<main class="ah">
  <div class="ah-head">
    <div>
      <h1 class="ah-title">Clash of Clans</h1>
      <p class="ah-sub">Written by Parcore, former #1 in the Philippines</p>
    </div>
    <label class="ah-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input type="search" id="artSearch" placeholder="Search articles" aria-label="Search articles" autocomplete="off">
    </label>
  </div>
  
  <!-- Rows (and the game filter above) are built from /articles.json by article-cards.js. -->
  <div class="art-feed" data-game="coc"></div>
  <p class="ah-empty" id="artEmpty" hidden></p>
</main>

<footer class="pf-footer">

  <!-- Nothing here is hardcoded. Socials, legal links, copyright and the
  disclaimer come from 11footer.json; the link row mirrors the sidebar
  (sidebar.json's topBox + games, minus tripleA). Both are rendered by
  11layout.js at runtime, so edit those JSON files, not this markup. -->
  <p class="pf-footer-social-label" id="pfSocialLabel">Follow us on</p>
  <div class="pf-footer-social" id="pfFooterSocial"></div>

  <div class="pf-footer-divider"></div>

  <div class="pf-footer-links" id="pfFooterLinks"></div>

  <div class="pf-footer-divider"></div>

  <div class="pf-footer-bottom">
    <div class="pf-footer-legal" id="pfFooterLegal"></div>
  </div>

  <p class="pf-footer-disclaimer" id="pfFooterDisclaimer"></p>

  <div class="pf-footer-copyright" id="pfFooterCopyright"></div>

</footer>
</div>  </div>

<!-- More sheet + bottom nav (phones). Rows and items come from
     game-nav.json (initHubNav in 11layout.js); open/close is in 11layout.js. -->
<div class="more-overlay" id="moreOverlay" onclick="closeMoreMenu()">
  <div class="more-sheet" onclick="event.stopPropagation()">
    <div class="more-sheet-scroll">
      <div class="more-sheet-top">
        <div class="more-sheet-handle"></div>
        <div class="more-sheet-header">
          <div class="more-sheet-title">Articles</div>
          <button type="button" class="more-sheet-close" onclick="closeMoreMenu()" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="more-list"></div>
    </div>
  </div>
</div>
<div class="bn-bar" id="bottomNav">
  <div class="bn-more-wrap" id="bnMoreWrap">
    <div class="bn-more-spacer"></div>
    <button type="button" class="bn-more" id="bnMoreBtn" onclick="toggleMoreMenu()" aria-label="More">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4" stroke-width="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4" stroke-width="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4" stroke-width="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4" stroke-width="1.8"/></svg>
    </button>
    <span class="bn-more-label">More</span>
  </div>
</div>

<script src="/11layout.js?v=20261008c"></script>
<script src="/article-cards.js" defer></script>
</body>
</html>
