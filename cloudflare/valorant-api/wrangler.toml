# Cloudflare Worker for /api/valorant (HenrikDev + VLR.gg news). Code: worker.js.
# Lives outside site/, so Netlify never publishes it.
#
# First time (from this folder, in a terminal; the browser login fails on this
# PC, so set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID first, same as coc-api):
#   npx wrangler secret put HENRIK_API_KEY   # paste the HenrikDev key when it asks
#   npx wrangler deploy                      # prints the Worker's address
# After a change to worker.js: npx wrangler deploy
# Logs while testing: npx wrangler tail

name = "parchrome-valorant"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
