# Cloudflare Worker for /api/coc (the Clash of Clans API door). Code: worker.js.
# Lives outside site/, so Netlify never publishes it.
#
# First time (from this folder, in a terminal):
#   npx wrangler login                    # opens the browser, sign in to Cloudflare
#   npx wrangler secret put COC_API_KEY   # paste the Supercell key when it asks
#   npx wrangler deploy                   # prints the Worker's address
# After a change to worker.js: npx wrangler deploy
# Logs while testing: npx wrangler tail

name = "parchrome-coc"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
