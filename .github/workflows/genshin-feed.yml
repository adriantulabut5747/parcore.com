# Refreshes site/genshin-feed.json (wishes, events, endgame, codes, farm schedule,
# birthdays), site/genshin-history.json (every past wish, for the rerun tracker;
# from paimon.moe's MIT-licensed banner list) and the featured 5-stars' wish art in site/images/genshin/splash/ for
# the Genshin Impact lobby, plus site/genshin-weapons.json + weapon art (/genshin-impact/weapons), site/genshin-artifacts.json + piece icons (/genshin-impact/artifacts), site/genshin-birthdays.json + namecards (/genshin-impact/birthdays), site/genshin-nations.json (/genshin-impact/nations, checked daily), site/genshin-achievements.json + category medals (/genshin-impact/achievements), site/genshin-enemies.json + genshin-enemies-more.json + enemy icons (/genshin-impact/enemies, checked daily), site/genshin-wishpool.json + every pool character's wish art (/genshin-impact/wish-simulator), every 3 hours (codes come and go fast).
# No secrets needed: every source is public. See scripts/genshin-feed.py.
#
# Run it by hand any time from the Actions tab ("Run workflow").
name: Update Genshin feed

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genshin-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            site/genshin-feed.json
            site/genshin-history.json
            site/genshin-enka-map.json
            site/genshin-weapons.json
            site/genshin-artifacts.json
            site/genshin-birthdays.json
            site/genshin-nations.json
            site/genshin-achievements.json
            site/genshin-enemies.json
            site/genshin-enemies-more.json
            site/genshin-wishpool.json
            site/images/genshin
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Genshin feed
        run: |
          pip install pillow
          python scripts/genshin-feed.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- site/genshin-feed.json site/genshin-history.json site/genshin-enka-map.json site/genshin-weapons.json site/genshin-artifacts.json site/genshin-birthdays.json site/genshin-nations.json site/genshin-achievements.json site/genshin-enemies.json site/genshin-enemies-more.json site/genshin-wishpool.json site/images/genshin)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/genshin-feed.json site/genshin-history.json site/genshin-enka-map.json site/genshin-weapons.json site/genshin-artifacts.json site/genshin-birthdays.json site/genshin-nations.json site/genshin-achievements.json site/genshin-enemies.json site/genshin-enemies-more.json site/genshin-wishpool.json site/images/genshin
          git commit -m "Update Genshin feed"
          git pull --rebase
          git push
