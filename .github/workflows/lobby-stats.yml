# Refreshes site/coc-lobby-stats.json (leaderboards + equipment counts for
# /coc/tools/leaderboards) and site/coc-lobby-home.json (the /coc/ sections)
# once a week (Oct 24 2026, Adrian: was daily). It runs Sunday 22:00 UTC, seven
# hours before the Monday 05:00 UTC league reset, so the files hold the week's
# final standings ("Top players of the week" on /coc/). The gap absorbs
# GitHub's late cron starts: the Monday 03:00 slot started at 08:42 on Oct 26,
# after the reset. Each run makes ~610 API calls and every commit is a new
# deploy. See scripts/lobby-stats.mjs.
#
# Uses the same COC_API_KEY secret as clan-stats. Run it by hand any time
# from the Actions tab ("Run workflow").
name: Update lobby stats

on:
  schedule:
    - cron: "0 22 * * 0" # Sunday 22:00 UTC = Monday 6:00 AM Philippines time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lobby-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            site/coc-lobby-stats.json
            site/coc-lobby-home.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch lobby stats
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
        run: node scripts/lobby-stats.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- site/coc-lobby-stats.json site/coc-lobby-home.json)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/coc-lobby-stats.json site/coc-lobby-home.json
          git commit -m "Update lobby stats"
          git pull --rebase
          git push
