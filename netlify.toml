# Netlify settings for Parchrome. Read automatically once the site deploys
# from GitHub (drag-and-drop deploys ignore it -- and ignore functions).
# No build step: the site is plain HTML/CSS/JS, served as-is.
#
# Only site/ is published. Everything else in the repo (docs/, scripts/,
# PRODUCT.md, .github/, design notes) stays private -- keep it out of site/.
# Drag-and-drop deploys: drag the site/ folder, not the repo folder.
[build]
  publish = "site"
  functions = "netlify/functions"
