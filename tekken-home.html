<style>
.codm-hero{
  position:relative;
  min-width:100%;
  min-height:455px;
  max-height:420px;
  overflow:hidden;
  flex:0 0 auto;
  background:#0c0c0d;
  margin-top: 45px;
}
.codm-hero-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background-image:url('https://i.pinimg.com/736x/00/00/18/0000187347ec242fc8148f4af06fd12e.jpg');
  background-repeat:no-repeat;
  background-size:cover;
  background-position:center 15%;
  filter:saturate(1.1) contrast(1.05);
  z-index:1;
}
/* On mobile this gets overridden with an explicit oversized background-size below,
   which guarantees both left-right AND up-down panning always work — with plain
   "cover", the crop math only leaves room to pan in ONE direction depending on
   how the image's shape compares to the box's shape (that's why the vertical
   number seemed to do nothing before: there was zero vertical room to pan through). */
/* fallback look when no image is supplied yet */
.codm-hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 80% 20%, rgba(194,45,45,0.16), transparent 55%),
    linear-gradient(135deg, #150404 0%, #0c0c0d 55%, #050505 100%);
  z-index:0;
}
.codm-hero-overlay{
  position:absolute;
  inset:0;
  z-index:2;
  display:flex;
  align-items:center;
  padding-left:6%;
  background:
    linear-gradient(90deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.25) 100%),
    linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 45%);
}
/* Fade the very bottom of the hero into the same dark tone the battle pass
   widget uses, so the two sections blend into one continuous surface
   instead of meeting at a hard edge. */
.codm-hero::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:0;
  height:180px;
  z-index:3;
  pointer-events:none;
  background:linear-gradient(to bottom, rgba(18,18,19,0) 0%, rgba(18,18,19,0.75) 60%, #121213 100%);
}

.codm-hero-content{
  position:relative;
  z-index:3;
  max-width:640px;
  color:#fff;
  animation:codmFadeInUp .8s ease forwards;
  margin-top: 50px;
}
.codm-hero-eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;

/* ============================================================
   NOTHING BEHIND THE BARS BUT THE PAGE ITSELF
   ============================================================
   .main used to carry margin-top:52px to clear the fixed top bar, so
   .coc-main -- the scroller, and the thing that paints the page -- began at
   y=52. The mobile secondary bar is only 38px tall, so the moment it lifted
   into the top bar's slot on scroll, y=38..52 was a strip of bare <body>
   between the bar and the content. The scroller now starts at the top of the
   viewport and gives that 52px back as padding, so content sits exactly
   where it did before and there is no seam whatever the bars do.

   The sidebar took its offset from .main's margin, so it carries it itself
   at desktop widths; on mobile it is a fixed drawer with its own top:52px
   and never depended on it. */
.main{ margin-top: 0; }
.coc-main{ padding-top: var(--topbar-height, 52px); }
