<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux Scenario Quiz</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b36;
    --text: #f2f3f5;
    --accent: #7dd3fc;
    --gray: #8b93a1;
    --green: #4ade80;
    --green-bg: #14321f;
    --red: #f87171;
    --red-bg: #351818;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 20px 16px 40px;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }
  header { margin-bottom: 16px; }
  h1 { font-size: 1.25rem; margin: 0 0 10px; }
  .bar-wrap {
    background: var(--border);
    height: 6px;
    border-radius: 99px;
    overflow: hidden;
  }
  .bar { background: var(--accent); height: 100%; width: 0%; transition: width .2s; }
  .meta {
    display: flex;
    justify-content: space-between;
    color: var(--gray);
    font-size: 0.8rem;
    margin-top: 8px;
  }
  .scenario {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 16px;
    margin: 18px 0 14px;
    font-size: 1.05rem;
    line-height: 1.45;
  }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 14px;
    margin-bottom: 8px;
    font-size: 1rem;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    cursor: pointer;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; opacity: 0.55; }
  .opt .lbl {
    color: var(--gray);
    font-family: -apple-system, sans-serif;
    font-weight: 700;
    margin-right: 8px;
  }
  .opt.correct {
    background: var(--green-bg);
    border-color: var(--green);
    opacity: 1;
  }
  .opt.correct .lbl { color: var(--green); }
  .opt.wrong {
    background: var(--red-bg);
    border-color: var(--red);
    opacity: 1;
  }
  .opt.wrong .lbl { color: var(--red); }
  #feedback {
    margin-top: 14px;
    padding: 14px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 0.92rem;
    line-height: 1.45;
    color: var(--gray);
    display: none;
  }
  #feedback strong { display: block; margin-bottom: 4px; font-size: 1rem; }
  #feedback.ok strong { color: var(--green); }
  #feedback.no strong { color: var(--red); }
  button.primary {
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #0f1115;
    cursor: pointer;
    display: none;
  }
  .hidden { display: none !important; }
  #summary { text-align: center; padding-top: 30px; }
  #summary .score { font-size: 3rem; font-weight: 800; color: var(--accent); }
  #summary .sub { color: var(--gray); margin: 6px 0 24px; }
  .missed {
    text-align: left;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .missed .q { font-size: 0.9rem; margin-bottom: 6px; }
  .missed .a {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    color: var(--green);
    font-size: 0.95rem;
    font-weight: 600;
  }
  h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--gray); text-align: left; margin: 26px 0 10px; }
</style>
</head>
<body>

<div id="quiz">
  <header>
    <h1>Linux Scenario Drill</h1>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="meta"><span id="progress"></span><span id="score"></span></div>
  </header>
  <div class="scenario" id="scenario"></div>
  <div id="options"></div>
  <div id="feedback"></div>
  <button class="primary" id="nextBtn">Next →</button>
</div>

<div id="summary" class="hidden"></div>

<script>
const QUESTIONS = [
  ["You're asked to list every file in the current directory, including hidden ones, with permissions shown.","ls -la",["ls","ls -lt","cd -"],"-l gives the long format with permissions; -a includes dotfiles."],
  ["You need to create the folder chain project/src/components in one go, but none of them exist yet.","mkdir -p project/src/components","mkdir project/src/components|cd -p project/src/components|touch project/src/components".split("|"),"-p creates every missing parent directory instead of failing."],
  ["A client wants an entire folder and everything inside it deleted immediately, no prompts.","rm -rf oldproject/","rm oldproject/|rmdir oldproject/|rm -i oldproject/".split("|"),"-r recurses into the folder, -f forces it without confirmation."],
  ["You must copy a whole directory, including subfolders, to a backup location.","cp -r site/ backup/","cp site/ backup/|mv -r site/ backup/|tar site/ backup/".split("|"),"-r is required for directories; plain cp only handles single files."],
  ["Rename report_draft.txt to report_final.txt.","mv report_draft.txt report_final.txt","cp report_draft.txt report_final.txt|rename report_draft.txt|mv -r report_draft.txt report_final.txt".split("|"),"mv to a new name in the same folder is how Linux renames files."],
  ["A log file is huge and you only want to scroll through it page by page.","less server.log","cat server.log|head server.log|tail server.log".split("|"),"less pages through a file without loading it all on screen."],
  ["You want to watch a log file live as new entries get written during a deployment.","tail -f deploy.log","tail deploy.log|cat -f deploy.log|less deploy.log".split("|"),"-f follows the file, printing new lines as they arrive."],
  ["You only need to see the first 10 lines of a CSV to check its headers.","head data.csv","tail data.csv|cat data.csv|less -10 data.csv".split("|"),"head defaults to the first 10 lines of a file."],
  ["Search every file under /var/log for the word TIMEOUT.","grep -r \"TIMEOUT\" /var/log/","grep \"TIMEOUT\" /var/log/|find /var/log -name TIMEOUT|cat /var/log | TIMEOUT".split("|"),"-r makes grep descend recursively through all subdirectories."],
  ["Find matching lines but ignore whether the text is upper or lower case.","grep -i \"error\" app.log","grep -r \"error\" app.log|grep -n \"error\" app.log|grep -c \"error\" app.log".split("|"),"-i makes the pattern match case-insensitively."],
  ["You need the line numbers shown next to each grep match so you can jump to them in an editor.","grep -n \"function\" script.sh","grep -i \"function\" script.sh|grep -c \"function\" script.sh|grep -r \"function\" script.sh".split("|"),"-n prefixes each match with its line number."],
  ["Replace every occurrence of 'localhost' with '127.0.0.1' in a config file.","sed 's/localhost/127.0.0.1/g' config.conf","grep 's/localhost/127.0.0.1/' config.conf|awk '{localhost=127.0.0.1}' config.conf|cut -d'localhost' config.conf".split("|"),"sed substitutes text; the trailing g replaces all matches per line, not just the first."],
  ["Print only the first and third whitespace-separated columns of a report file.","awk '{print $1, $3}' report.txt","cut -f1,3 report.txt|sed '1,3p' report.txt|sort -k1,3 report.txt".split("|"),"awk splits lines into fields $1, $2, $3... and prints the ones you name."],
  ["Locate a file called invoice.pdf somewhere under /home.","find /home -name \"invoice.pdf\"","grep -r \"invoice.pdf\" /home|ls -R /home/invoice.pdf|locate -name invoice.pdf".split("|"),"find walks the directory tree matching on filename."],
  ["List only the files under /backup that were modified within the last week.","find /backup -mtime -7","find /backup -name -7|ls -lt /backup | head -7|find /backup -size -7".split("|"),"-mtime -7 filters to files modified less than 7 days ago."],
  ["You wrote deploy.sh but the shell says permission denied when you try to run it.","chmod +x deploy.sh","chown +x deploy.sh|chmod 644 deploy.sh|sudo deploy.sh".split("|"),"The file needs its execute bit set before the shell will run it."],
  ["Set a script so the owner can read/write/execute and everyone else can only read and execute.","chmod 755 script.sh","chmod 777 script.sh|chmod 644 script.sh|chmod 700 script.sh".split("|"),"7 = rwx for owner, 5 = r-x for group and others."],
  ["Transfer ownership of an entire web directory to the user www-data and its group.","chown -R www-data:www-data /var/www/","chmod -R www-data /var/www/|usermod -R www-data /var/www/|chown www-data /var/www/".split("|"),"-R applies the ownership change recursively to everything inside."],
  ["Show every process running on the system with CPU and memory usage, as a snapshot.","ps aux","ps|top|jobs".split("|"),"ps aux lists all processes for all users with resource columns."],
  ["You want a continuously refreshing view of CPU and memory usage by process.","top","ps aux|uptime|vmstat".split("|"),"top refreshes live; ps is a one-time snapshot."],
  ["A process with PID 8842 is frozen and ignores a normal kill.","kill -9 8842","kill 8842|killall 8842|kill -HUP 8842".split("|"),"-9 sends SIGKILL, which cannot be caught or ignored by the process."],
  ["Stop every running instance of a program named nginx without looking up PIDs.","killall nginx","kill nginx|kill -9 nginx|pkill -9 -PID nginx".split("|"),"killall matches by process name instead of requiring a PID."],
  ["Display the kernel version, architecture, and hostname all at once.","uname -a","uname|hostname|lscpu".split("|"),"-a prints all system information fields together."],
  ["Check how much space is left on each mounted filesystem, in GB.","df -h","du -h|free -h|lsblk".split("|"),"df reports per-filesystem space; -h makes units human-readable."],
  ["Find out the total size of the /var/log folder as a single number.","du -sh /var/log","df -h /var/log|du -h /var/log|ls -lh /var/log".split("|"),"-s summarizes to one total instead of listing every file."],
  ["Check how much RAM and swap the server is currently using.","free -h","df -h|top -m|du -sh".split("|"),"free reports memory and swap usage; -h for readable units."],
  ["Find out how long the server has been running since its last reboot.","uptime","last|date|who".split("|"),"uptime shows time since boot plus load averages."],
  ["Verify whether the server can reach google.com over the network.","ping google.com","traceroute google.com|ss -tuln|ip addr show".split("|"),"ping sends ICMP packets and reports whether the host replies."],
  ["Send exactly 4 test packets to a router at 192.168.1.1 instead of pinging forever.","ping -c 4 192.168.1.1","ping -4 192.168.1.1|ping -n 4 192.168.1.1|ping -t 4 192.168.1.1".split("|"),"-c limits the number of packets sent."],
  ["List all network interfaces on the machine with their assigned IP addresses.","ip addr show","ip route show|ss -tuln|ping localhost".split("|"),"ip addr show lists interfaces and their addresses."],
  ["Check which TCP and UDP ports are currently listening for connections.","ss -tuln","ip addr show|ping -c 4 localhost|ps aux | grep port".split("|"),"ss -tuln lists listening TCP/UDP sockets with numeric ports."],
  ["Securely copy report.pdf to /home/admin on a remote server.","scp report.pdf admin@server:/home/admin/","cp report.pdf admin@server:/home/admin/|rsync report.pdf admin@server|ftp report.pdf admin@server".split("|"),"scp copies files over SSH to a remote path."],
  ["Sync a local project folder to a remote server, transferring only what changed.","rsync -avz project/ user@host:/srv/project/","scp -r project/ user@host:/srv/project/|cp -avz project/ user@host|tar -czf project/ user@host".split("|"),"rsync transfers only differences; -a archive, -v verbose, -z compress."],
  ["Create a compressed backup archive of /home/user and watch each file as it's added.","tar -czvf backup.tar.gz /home/user/","tar -xzvf backup.tar.gz /home/user/|gzip -r /home/user/|zip -czvf backup.tar.gz /home/user/".split("|"),"c=create, z=gzip, v=verbose, f=filename. x would extract instead."],
  ["Unpack a file called release.tar.gz into the current directory.","tar -xzf release.tar.gz","tar -czf release.tar.gz|unzip release.tar.gz|gzip release.tar.gz".split("|"),"x extracts, z handles the gzip compression, f names the file."],
  ["Extract an archive into /opt instead of the current folder.","tar -xzf app.tar.gz -C /opt/","tar -xzf app.tar.gz /opt/|tar -xzf -d /opt/ app.tar.gz|cd /opt && tar -czf app.tar.gz".split("|"),"-C changes to the target directory before extracting."],
  ["Create a new user named intern and give them a home directory.","useradd -m intern","useradd intern|usermod -m intern|adduser -home intern".split("|"),"-m creates the home directory; without it, none is made."],
  ["Give an existing user sudo rights without removing their current groups.","usermod -aG sudo devops","usermod -G sudo devops|groupadd sudo devops|chown devops:sudo".split("|"),"-a appends to the group list; -G alone would replace all groups."],
  ["Reset the password for the account 'jmoreno' as root.","passwd jmoreno","chage jmoreno|usermod -p jmoreno|su - jmoreno".split("|"),"passwd followed by a username sets that account's password."],
  ["Remove a departing employee's account along with their home directory.","userdel -r jsmith","userdel jsmith|usermod -r jsmith|rm -rf /home/jsmith".split("|"),"-r deletes the home directory and mail spool alongside the account."],
  ["Install the package nginx on an Ubuntu server.","apt install nginx","yum install nginx|snap refresh nginx|apt search nginx".split("|"),"apt is the package manager on Debian-based distributions."],
  ["Refresh the package index and then upgrade everything installed on Ubuntu.","apt update && apt upgrade","apt upgrade && apt update|apt install --all|yum update".split("|"),"update refreshes the available package list; upgrade then installs newer versions."],
  ["Install a package on a CentOS or RHEL server.","yum install httpd","apt install httpd|snap install httpd|flatpak install httpd".split("|"),"yum/dnf is the package manager on Red Hat-based systems."],
  ["Open the firewall so remote admins can connect over SSH.","ufw allow ssh","ufw deny ssh|ufw enable ssh|iptables ssh".split("|"),"ufw allow accepts a service name and opens the right port."],
  ["Check whether the firewall is active and review all current rules.","ufw status verbose","ufw enable|iptables -L -v|ufw allow status".split("|"),"status verbose shows active state plus the full rule list."],
  ["Verify that a downloaded ISO wasn't corrupted by checking its hash.","sha256sum linux.iso","md5sum -c linux.iso|sha256sum -e linux.iso|checksum linux.iso".split("|"),"sha256sum generates the hash you compare against the published one."],
  ["Check whether the ssh service is currently running.","systemctl status ssh","systemctl start ssh|journalctl ssh|ps aux | ssh".split("|"),"systemctl status reports whether a service is active and healthy."],
  ["Make sure the nginx service starts automatically after every reboot.","systemctl enable nginx","systemctl start nginx|systemctl restart nginx|systemctl status nginx".split("|"),"enable sets the service to launch at boot; start only runs it now."],
  ["View the live system journal as new log entries come in.","journalctl -f","journalctl|dmesg|tail /var/log".split("|"),"-f follows the journal in real time, like tail -f."],
  ["Look at only the logs produced by the apache2 service.","journalctl -u apache2","journalctl -f apache2|dmesg | grep apache2|systemctl apache2 logs".split("|"),"-u filters the journal to a single systemd unit."],
  ["Print the full absolute path of the directory you're currently in.","pwd","ls|cd|whoami".split("|"),"pwd prints the working directory path."],
  ["Find out which user account you're currently logged in as.","whoami","who|w|last".split("|"),"whoami prints just your own effective username."],
  ["See a list of everyone currently logged into the server.","who","whoami|last|env".split("|"),"who lists all currently logged-in users and their sessions."],
  ["Count how many lines are in a large text file.","wc -l data.txt","wc data.txt|cat -n data.txt|sort -n data.txt".split("|"),"-l restricts wc to counting lines only."],
  ["Sort a file's lines and strip out any duplicate entries.","sort names.txt | uniq","uniq names.txt|sort -u -d names.txt|cat names.txt | sort -r".split("|"),"uniq only removes adjacent duplicates, so the file must be sorted first."],
  ["Save a command's output into a file, wiping whatever was there before.","command > output.txt","command >> output.txt|command < output.txt|command | output.txt".split("|"),"A single > overwrites; >> would append to the existing file instead."],
  ["Append a command's output to the end of an existing log file.","command >> log.txt","command > log.txt|command < log.txt|command &> log.txt".split("|"),">> appends without erasing the current contents."],
  ["Create a permanent shortcut so 'll' always runs 'ls -la'.","echo \"alias ll='ls -la'\" >> ~/.bashrc","alias ll='ls -la'|export ll='ls -la'|unalias ll".split("|"),"Running alias alone only lasts the session; appending to .bashrc makes it permanent."],
  ["Reload your shell config after editing .bashrc, without logging out.","source ~/.bashrc","bash ~/.bashrc|export ~/.bashrc|nano ~/.bashrc".split("|"),"source re-executes the file in your current shell session."],
  ["Run a long backup job so it keeps running after you disconnect from SSH.","nohup backup.sh &","backup.sh &|bg backup.sh|fg backup.sh".split("|"),"nohup detaches the job from the terminal so it survives logout."],
  ["Check and repair a corrupted filesystem on /dev/sda1.","fsck /dev/sda1","mount /dev/sda1|df -h /dev/sda1|chkdsk /dev/sda1".split("|"),"fsck checks and repairs filesystem corruption."],
  ["List every systemd service that has failed.","systemctl --failed","systemctl status|journalctl -p err|systemctl list failed".split("|"),"--failed filters directly to units in a failed state."],
  ["Set the server's hostname to web-prod-01.","hostnamectl set-hostname web-prod-01","hostname web-prod-01|uname -n web-prod-01|echo web-prod-01 > /hostname".split("|"),"hostnamectl sets the hostname persistently across reboots."]
];

let deck = [], idx = 0, score = 0, missed = [], answered = false;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDeck() {
  deck = shuffle(QUESTIONS).map(([scenario, correct, wrongs, explain]) => ({
    scenario, correct, explain,
    options: shuffle([correct, ...wrongs])
  }));
  idx = 0; score = 0; missed = [];
}

function render() {
  answered = false;
  const q = deck[idx];
  document.getElementById('scenario').textContent = q.scenario;
  document.getElementById('progress').textContent = `Question ${idx + 1} of ${deck.length}`;
  document.getElementById('score').textContent = `Score: ${score}`;
  document.getElementById('bar').style.width = ((idx / deck.length) * 100) + '%';

  const fb = document.getElementById('feedback');
  fb.style.display = 'none';
  fb.className = '';
  document.getElementById('nextBtn').style.display = 'none';

  const box = document.getElementById('options');
  box.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="lbl">${labels[i]}</span>${opt}`;
    btn.onclick = () => choose(btn, opt, q);
    box.appendChild(btn);
  });
}

function choose(btn, opt, q) {
  if (answered) return;
  answered = true;
  const correct = opt === q.correct;
  if (correct) score++;
  else missed.push(q);

  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    const txt = b.textContent.slice(1).trim();
    if (txt === q.correct) b.classList.add('correct');
  });
  if (!correct) btn.classList.add('wrong');

  const fb = document.getElementById('feedback');
  fb.className = correct ? 'ok' : 'no';
  fb.innerHTML = `<strong>${correct ? 'Correct' : 'Not quite — ' + q.correct}</strong>${q.explain}`;
  fb.style.display = 'block';

  document.getElementById('score').textContent = `Score: ${score}`;
  const nb = document.getElementById('nextBtn');
  nb.textContent = (idx === deck.length - 1) ? 'See results →' : 'Next →';
  nb.style.display = 'block';
}

document.getElementById('nextBtn').onclick = () => {
  idx++;
  if (idx >= deck.length) showSummary();
  else render();
};

function showSummary() {
  document.getElementById('quiz').classList.add('hidden');
  const s = document.getElementById('summary');
  s.classList.remove('hidden');
  const pct = Math.round((score / deck.length) * 100);
  let html = `<div class="score">${score}/${deck.length}</div><div class="sub">${pct}% correct</div>`;
  if (missed.length) {
    html += `<h3>Review these (${missed.length})</h3>`;
    missed.forEach(q => {
      html += `<div class="missed"><div class="q">${q.scenario}</div><div class="a">${q.correct}</div></div>`;
    });
  } else {
    html += `<div class="sub">Perfect round. You're ready.</div>`;
  }
  html += `<button class="primary" style="display:block" onclick="restart()">Shuffle &amp; retry</button>`;
  s.innerHTML = html;
}

function restart() {
  document.getElementById('summary').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  buildDeck();
  render();
}

buildDeck();
render();
</script>

</body>
</html>
